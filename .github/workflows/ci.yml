name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Bash smoke — install.sh --help
        if: runner.os != 'Windows'
        shell: bash
        continue-on-error: true
        run: bash install.sh --help || true

      - name: Python smoke — sync-opencode-sdd.py
        if: runner.os != 'Windows'
        shell: bash
        continue-on-error: true
        run: |
          python3 files/sync-opencode-sdd.py --help 2>/dev/null \
            || python3 files/sync-opencode-sdd.py --test 2>&1 | head -5 \
            || true

      - name: PS1 smoke — install.ps1 -DryRun
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        env:
          AGENT_STACK_LIB: C:\agent-stack-stub
        run: |
          powershell -NonInteractive -File install.ps1 -DryRun
